<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문의 - 컬러 팔레트 생성기</title>
<meta name="description" content="컬러 팔레트 생성기에 대한 문의사항을 보내주세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8896961198330137" crossorigin="anonymous"></script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DSGL4BJH4R"></script>
<script>window.dataLayer = window.dataLayer || [];function gtag(){dataLayer.push(arguments);}gtag('js', new Date());gtag('config', 'G-DSGL4BJH4R');</script>
<style>
:root { --navy: #0d253d; --indigo: #533afd; --indigo-light: #6b55fd; --white: #ffffff; --gray-300: #b0b8cc; --gray-400: #8892a8; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 300; background: var(--navy); color: var(--gray-300); line-height: 1.6; }
a { color: var(--indigo); text-decoration: none; }
.site-header { background: rgba(13,37,61,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(83,58,253,0.15); position: fixed; top: 0; left: 0; right: 0; z-index: 100; }
.header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 1rem; height: 60px; }
.logo { display: flex; align-items: center; gap: 0.5rem; color: var(--white); font-weight: 600; }
.logo svg { width: 24px; height: 24px; color: var(--indigo); }
.nav-links a { color: var(--gray-300); font-size: 0.875rem; }
.page-hero { padding: 120px 1rem 60px; background: radial-gradient(ellipse 80% 50% at 50% 40%, rgba(83,58,253,0.1), transparent), var(--navy); text-align: center; }
.page-hero h1 { font-size: 2.5rem; font-weight: 500; color: var(--white); }
.main-content { max-width: 600px; margin: 0 auto; padding: 2rem 1rem 4rem; }
.card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 1.5rem; }
p { margin-bottom: 1rem; }
.site-footer { border-top: 1px solid rgba(255,255,255,0.06); padding: 3rem 1rem 2rem; margin-top: 4rem; text-align: center; font-size: 0.8rem; color: var(--gray-400); }
@media (max-width: 768px) { .page-hero h1 { font-size: 1.75rem; } }
</style>
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a href="/" class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13.5" cy="6.5" r="4.5"/><circle cx="5" cy="18" r="3"/><circle cx="19" cy="18" r="3"/><path d="M9 18L13.5 11"/><path d="M18 18L13.5 11"/></svg> 컬러 팔레트</a>
  </div>
</header>
<section class="page-hero"><h1>문의하기</h1></section>
<div class="main-content">
  <div class="card">
    <p>문의사항이나 제안이 있으시면 아래 이메일로 연락해 주세요.</p>
    <p style="color:var(--white);font-size:1rem">contact@color-palette.example.com</p>
    <p>일반적인 질문은 FAQ 페이지를 먼저 확인해 주시면 더 빠르게 답변을 찾으실 수 있습니다.</p>
  </div>
</div>
<footer class="site-footer"><div class="footer-bottom">&copy; 2026 컬러 팔레트.</div></footer>
</body>
</html>
